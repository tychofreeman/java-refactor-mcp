name: CI

on:
  push:
    branches: [main]
    # Docs-only changes do not run CI. Keep this list in step with what counts as docs.
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compiles with -Xlint:all -Werror and runs the golden tests.
      - name: mvn verify
        run: mvn -B verify

  lint:
    name: Lint (formatting)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Fails if any Java file differs from google-java-format output. Fix locally with: mvn spotless:apply
      - name: Check formatting
        run: mvn -B spotless:check
